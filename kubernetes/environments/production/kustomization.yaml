apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workload-production
resources:
  - ../../blueprint-templates/platform-baseline
  - ../../blueprint-templates/web-workload
  - ingress.yaml
labels:
  - pairs:
      environment: production
      platform-environment: production
    includeSelectors: true
replicas:
  - name: web-workload
    count: 3
patches:
  - target:
      version: v1
      kind: Namespace
      name: platform-workload
    path: namespace-patch.yaml
  - target:
      version: v1
      kind: ResourceQuota
      name: workload-budget
    path: resource-quota-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web-workload
    path: deployment-patch.yaml
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: web-workload
    path: pdb-patch.yaml
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: web-workload
    path: hpa-patch.yaml
