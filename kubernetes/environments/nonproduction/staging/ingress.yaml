apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-workload
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  tls:
    - hosts:
        - web.staging.example.internal
      secretName: web-staging-tls
  rules:
    - host: web.staging.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-workload
                port:
                  number: 80
