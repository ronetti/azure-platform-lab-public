apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inference-workload
  labels:
    app.kubernetes.io/name: inference-workload
    app.kubernetes.io/part-of: azure-platform-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-workload
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
