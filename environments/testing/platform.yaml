environment: testing
location: westeurope
address_space:
  - 10.10.0.0/16
subnets:
  app: 10.10.1.0/24
  data: 10.10.2.0/24
  ingress: 10.10.10.0/24
  management: 10.10.20.0/24
features:
  application_gateway: true
  waf: true
  firewall: false
  aks: false
  configuration_management: true
  monitoring: true
monitoring:
  retention_days: 30
  enable_diagnostics: true
availability:
  target_slo: 99.0
  error_budget_policy: review-before-feature-rollout
governance:
  single_source_of_truth: git
  change_model: pull-request
  required_reviews: 1
guardrails:
  terraform: true
  yaml: true
  kubernetes: true
  ansible: true
