environment: production
location: germanywestcentral
address_space:
  - 10.30.0.0/16
subnets:
  app: 10.30.1.0/24
  data: 10.30.2.0/24
  ingress: 10.30.10.0/24
  management: 10.30.20.0/24
features:
  application_gateway: true
  waf: true
  firewall: true
  aks: true
  configuration_management: true
  monitoring: true
monitoring:
  retention_days: 90
  enable_diagnostics: true
availability:
  target_slo: 99.9
  error_budget_policy: stabilize-before-feature-rollout
governance:
  single_source_of_truth: git
  change_model: pull-request
  required_reviews: 2
guardrails:
  terraform: true
  yaml: true
  kubernetes: true
  ansible: true
