platform_name: az-platform-lab
environment: production
status: architecture-model
location: germanywestcentral

terraform_backend:
  resource_group_name: rg-tfstate-platform-production
  storage_account_name: sttfstateplatformprod
  container_name: tfstate
  use_azuread_auth: true

used_for:
  production:
    namespace: workload-production
    deployment: blue-green
    implementation: requires-rollout-controller
    traffic_switch: two-person-approval-required
    rollback: switch-to-previous-color
    release_input: approved-immutable-artifact
    runtime_dependency_on_nonproduction: false

dedicated_infrastructure:
  terraform_state: true
  network: true
  application_gateway_and_waf: true
  firewall: true
  aks_cluster: true
  container_registry: true
  key_vault: true
  monitoring: true
  storage: true

costs:
  profile: availability-first-rightsized
  stop_outside_working_hours: false
  spot_workloads: false
  controls:
    - no-spot-for-baseline-workloads
    - autoscale-within-reviewed-bounds
    - rightsize-from-production-metrics
    - evaluate-savings-plan-after-utilization-review
    - retain-logs-by-security-and-slo-requirement

security_boundary:
  dedicated_subscription_scope: true
  dedicated_terraform_state: true
  dedicated_network: true
  dedicated_cluster: true
  dedicated_identities: true
  dedicated_secrets: true
  dedicated_monitoring: true
  dedicated_container_registry: true
  nonproduction_remote_state_access: forbidden
  shared_runtime_resources_with_nonproduction: false

availability:
  target_slo: 99.9

guardrails:
  terraform: true
  yaml: true
  kubernetes: true
  secrets_outside_git: true
  required_reviews: 2

tags:
  purpose: platform-showcase
  single_source_of_truth: git

network:
  address_space:
    - 10.30.0.0/16
  subnets:
    app: 10.30.1.0/24
    data: 10.30.2.0/24
    ingress: 10.30.10.0/24
    management: 10.30.20.0/24
    aks: 10.30.32.0/21
    firewall: 10.30.100.0/26
  governance:
    required_reviews: 2
    error_budget_policy: stabilize-before-network-change

shared_services:
  monitoring:
    retention_days: 90
    sli_signals:
      - log-ingestion
      - diagnostic-settings
      - alert-actionability
  governance:
    required_reviews: 2
    error_budget_policy: stabilize-before-observability-change

routing:
  route_tables:
    - name: rt-app-egress
      subnet_keys:
        - app
        - data
        - aks
      routes:
        - name: default-to-firewall
          address_prefix: 0.0.0.0/0
          next_hop_type: VirtualAppliance
          next_hop_in_ip_address: 10.30.100.4
  governance:
    required_reviews: 2
    error_budget_policy: stabilize-before-routing-change

firewall:
  subnet_key: firewall
  network_rule_collections:
    - name: allow-management
      priority: 100
      action: Allow
      rules:
        - name: allow-admin-to-management
          source_addresses:
            - 10.30.20.0/24
          destination_addresses:
            - 10.30.1.0/24
          destination_ports:
            - "443"
          protocols:
            - TCP
  governance:
    required_reviews: 2
    error_budget_policy: stabilize-before-firewall-change

application_gateway:
  name: agw-platform-production
  subnet_key: ingress
  waf:
    mode: Prevention
    managed_rule_set:
      type: OWASP
      version: "3.2"
    exclusions: []
    custom_rules: []
  listeners:
    - name: https-production
      host_name: web.production.example.internal
      protocol: Https
      port: 443
  backends:
    - name: aks-ingress
      targets:
        - 10.30.32.20
      protocol: Https
      port: 443
      probe_path: /healthz
  availability:
    sli_signals:
      - listener-availability
      - backend-health
      - 5xx-rate
      - latency
    error_budget_policy: stabilize-before-edge-change
  governance:
    required_reviews: 2

compute:
  virtual_machines:
    - name: mgmt-01
      subnet_key: management
      size: Standard_D4ds_v5
      private_ip: 10.30.20.10
      image:
        publisher: Canonical
        offer: 0001-com-ubuntu-server-jammy
        sku: 22_04-lts-gen2
        version: latest
  inventory_source: terraform-output
  governance:
    required_reviews: 2
    error_budget_policy: stabilize-before-vm-change

configuration_management:
  host_groups:
    mgmt-01:
      - linux
      - management
  pipeline:
    runner: azure-devops-managed-pool
    guardrails:
      - yaml-lint
      - ansible-lint
      - syntax-check
      - check-mode
      - approval-before-production
  governance:
    required_reviews: 2
    error_budget_policy: stabilize-before-config-drift-change

aks:
  cluster:
    name: aks-platform-production
    sku: standard
    subnet_key: aks
    kubernetes_version_strategy: approved-production-version
    private_cluster_enabled: true
    network:
      plugin: azure
      plugin_mode: overlay
      dataplane: cilium
      outbound_type: userDefinedRouting
      service_cidr: 10.240.30.0/24
      dns_service_ip: 10.240.30.10
      pod_cidr: 10.246.0.0/16
    identity:
      entra_integration: true
      workload_identity: true
      oidc_issuer: true
    security:
      azure_policy: true
      deployment_safeguards: enforcement
      key_vault_csi: true
    ingress:
      controller: web-app-routing
      exposure: internal
      upstream_edge: application-gateway-waf
    operations:
      automatic_upgrade_channel: patch
      node_os_upgrade_channel: NodeImage
      maintenance_window: sunday-early
      stop_start_allowed: false
    node_pools:
      - name: system
        mode: System
        priority: Regular
        vm_size: Standard_D4ds_v5
        min_count: 2
        max_count: 3
        zones:
          - "1"
          - "2"
          - "3"
      - name: user
        mode: User
        priority: Regular
        vm_size: Standard_D4ds_v5
        min_count: 2
        max_count: 6
        zones:
          - "1"
          - "2"
          - "3"
      - name: aigpu
        mode: User
        priority: Regular
        vm_size: Standard_NC4as_T4_v3
        min_count: 0
        max_count: 2
        zones:
          - "1"
          - "2"
          - "3"
        workload_class: ai-inference
        status: modeled-not-provisioned
        accelerator: nvidia-t4
        taints:
          - workload.azure-lab.io/ai-inference=true:NoSchedule
        labels:
          workload.azure-lab.io/class: ai-inference
          workload.azure-lab.io/accelerator: gpu
        approval: required-before-enable
    availability:
      sli_signals:
        - node-readiness
        - pod-availability
        - deployment-availability
        - restart-rate
        - ingress-latency
      error_budget_policy: stabilize-before-node-pool-change
    ai_workload_platform:
      status: modeled-not-provisioned
      scope: production-inference
      node_pool: aigpu
      cost_controls:
        - no-spot-for-production-inference
        - rightsize-from-measured-utilization
        - explicit-approval-before-gpu-capacity
      scheduling:
        node_selector:
          workload.azure-lab.io/class: ai-inference
          workload.azure-lab.io/accelerator: gpu
        toleration: workload.azure-lab.io/ai-inference=true:NoSchedule
      model_artifacts:
        source: production-registry-or-model-store
        promotion: approved-immutable-artifact
      observability:
        - inference-latency
        - error-rate
        - gpu-utilization
        - model-load-failures
        - restart-rate
  governance:
    required_reviews: 2
