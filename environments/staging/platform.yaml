environment: staging
location: westeurope
address_space:
  - 10.20.0.0/16
subnets:
  app: 10.20.1.0/24
  data: 10.20.2.0/24
  ingress: 10.20.10.0/24
  management: 10.20.20.0/24
features:
  application_gateway: true
  waf: true
  firewall: true
  aks: false
  configuration_management: true
  monitoring: true
monitoring:
  retention_days: 60
  enable_diagnostics: true
availability:
  target_slo: 99.5
  error_budget_policy: approval-before-feature-rollout
governance:
  single_source_of_truth: git
  change_model: pull-request
  required_reviews: 1
guardrails:
  terraform: true
  yaml: true
  kubernetes: true
  ansible: true
