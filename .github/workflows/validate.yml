name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform stack validate
        run: |
          for stack in \
            network \
            shared-services \
            routing \
            firewall \
            application-gateway \
            compute \
            configuration-management \
            aks
          do
            terraform -chdir="terraform/stacks/${stack}" init -backend=false
            terraform -chdir="terraform/stacks/${stack}" validate
          done

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: YAML lint
        run: yamllint environments kubernetes helm terraform/stacks .github/workflows

      - name: Configuration-management guardrail contract
        run: |
          grep -q "ansible-lint" terraform/stacks/configuration-management/config/testing.yaml
          grep -q "check-mode" terraform/stacks/configuration-management/config/testing.yaml
          grep -q "approval-before-production" terraform/stacks/configuration-management/config/testing.yaml

      - name: Kubernetes schema validation
        run: kubeconform -summary -strict kubernetes
