remote_state:
  network:
    resource_group_name: rg-tfstate-platform
    storage_account_name: sttfstateplatform
    container_name: tfstate
    key: platform/network/testing.tfstate

firewall:
  subnet_key: firewall
  network_rule_collections:
    - name: allow-management
      priority: 100
      action: Allow
      rules:
        - name: allow-admin-to-management
          source_addresses:
            - 10.10.20.0/24
          destination_addresses:
            - 10.10.1.0/24
          destination_ports:
            - "443"
          protocols:
            - TCP

governance:
  single_source_of_truth: git
  change_model: pull-request
  required_reviews: 1
  error_budget_policy: review-before-firewall-change
