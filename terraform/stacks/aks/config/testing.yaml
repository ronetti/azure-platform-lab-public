remote_state:
  network:
    resource_group_name: rg-tfstate-platform
    storage_account_name: sttfstateplatform
    container_name: tfstate
    key: platform/network/testing.tfstate
  shared_services:
    resource_group_name: rg-tfstate-platform
    storage_account_name: sttfstateplatform
    container_name: tfstate
    key: platform/shared-services/testing.tfstate

cluster:
  name: aks-platform-testing
  subnet_key: app
  kubernetes_version: "1.29"
  private_cluster_enabled: true
  node_pools:
    - name: system
      vm_size: Standard_D4s_v5
      min_count: 1
      max_count: 3
    - name: user
      vm_size: Standard_D4s_v5
      min_count: 1
      max_count: 5
  availability:
    sli_signals:
      - node-readiness
      - pod-availability
      - deployment-availability
      - restart-rate
    error_budget_policy: review-before-node-pool-change

governance:
  single_source_of_truth: git
  change_model: pull-request
  required_reviews: 1
